<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Text ein-/ausklappen</title>
  <style>
    #textbereich {
      display: none;
      margin-top: 10px;
      padding: 10px;
      background-color: #f0f0f0;
      border: 1px solid #ccc;
    }
  </style>
</head>
<body>

  <button onclick="toggleText()">Text anzeigen/verbergen</button>

  <div id="textbereich">
    Das ist der ein- und ausklappbare Textbereich. Du kannst hier beliebigen Inhalt einfügen.
  </div>

  <script>
    function toggleText() {
      const textDiv = document.getElementById("textbereich");
      if (textDiv.style.display === "none") {
        textDiv.style.display = "block";
      } else {
        textDiv.style.display = "none";
      }
    }
  </script>

</body>
</html>
