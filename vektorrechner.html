<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Vektorrechner</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0f0f0f;
            --panel: #1a1a1a;
            --border: #2e2e2e;
            --accent: #c8f562;
            --accent2: #ff6b6b;
            --text: #f0f0f0;
            --muted: #777;
            --mono: 'Space Mono', monospace;
            --sans: 'Syne', sans-serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: var(--sans);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 48px 24px;
        }

        header {
            text-align: center;
            margin-bottom: 48px;
        }

        header h1 {
            font-size: 3rem;
            font-weight: 800;
            letter-spacing: -2px;
            line-height: 1;
        }

        header h1 span {
            color: var(--accent);
        }

        header p {
            color: var(--muted);
            font-family: var(--mono);
            font-size: 0.75rem;
            margin-top: 8px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .calc-wrapper {
            width: 100%;
            max-width: 720px;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        /* Dimension selector */
        .dim-row {
            display: flex;
            align-items: center;
            gap: 12px;
            font-family: var(--mono);
            font-size: 0.85rem;
            color: var(--muted);
        }

        .dim-row label { color: var(--accent); font-weight: 700; }

        .dim-btn {
            width: 36px; height: 36px;
            border: 1px solid var(--border);
            background: var(--panel);
            color: var(--text);
            font-family: var(--mono);
            font-size: 1rem;
            cursor: pointer;
            border-radius: 4px;
            transition: all 0.15s;
        }
        .dim-btn:hover { border-color: var(--accent); color: var(--accent); }
        .dim-btn.active { background: var(--accent); color: #000; border-color: var(--accent); font-weight: 700; }

        /* Vector input panels */
        .vectors-row {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            gap: 16px;
            align-items: center;
        }

        .vector-panel {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 20px;
            position: relative;
        }

        .vector-panel::before {
            content: attr(data-label);
            position: absolute;
            top: -10px;
            left: 16px;
            background: var(--accent);
            color: #000;
            font-family: var(--mono);
            font-size: 0.7rem;
            font-weight: 700;
            padding: 2px 8px;
            border-radius: 3px;
            letter-spacing: 1px;
        }

        .vector-bracket {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .bracket {
            font-size: 3rem;
            line-height: 1;
            color: var(--accent);
            font-weight: 300;
            user-select: none;
        }

        .vector-inputs {
            display: flex;
            flex-direction: column;
            gap: 8px;
            flex: 1;
        }

        .vector-input {
            background: var(--bg);
            border: 1px solid var(--border);
            color: var(--text);
            font-family: var(--mono);
            font-size: 1rem;
            padding: 8px 12px;
            border-radius: 4px;
            width: 100%;
            text-align: center;
            transition: border-color 0.15s;
            -moz-appearance: textfield;
        }
        .vector-input::-webkit-inner-spin-button { display: none; }
        .vector-input:focus {
            outline: none;
            border-color: var(--accent);
        }

        .op-symbol {
            font-size: 2rem;
            font-weight: 800;
            color: var(--muted);
            text-align: center;
            font-family: var(--mono);
        }

        /* Operation buttons */
        .ops-row {
            display: flex;
            gap: 12px;
        }

        .op-btn {
            flex: 1;
            padding: 14px;
            border: 1px solid var(--border);
            background: var(--panel);
            color: var(--text);
            font-family: var(--mono);
            font-size: 0.85rem;
            cursor: pointer;
            border-radius: 6px;
            transition: all 0.15s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .op-btn:hover { border-color: var(--accent); color: var(--accent); }
        .op-btn.primary {
            background: var(--accent);
            color: #000;
            border-color: var(--accent);
            font-weight: 700;
        }
        .op-btn.primary:hover { opacity: 0.85; }

        /* Result panel */
        .result-panel {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 24px;
            min-height: 80px;
            display: flex;
            align-items: center;
            gap: 16px;
            position: relative;
        }

        .result-panel::before {
            content: 'ERGEBNIS';
            position: absolute;
            top: -10px;
            left: 16px;
            background: var(--panel);
            color: var(--muted);
            font-family: var(--mono);
            font-size: 0.65rem;
            font-weight: 700;
            padding: 2px 8px;
            border: 1px solid var(--border);
            border-radius: 3px;
            letter-spacing: 2px;
        }

        .result-label {
            color: var(--accent2);
            font-family: var(--mono);
            font-size: 0.8rem;
            min-width: 60px;
        }

        .result-values {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .result-val {
            background: var(--bg);
            border: 1px solid var(--border);
            padding: 6px 14px;
            border-radius: 4px;
            font-family: var(--mono);
            font-size: 1rem;
            color: var(--accent);
            animation: popIn 0.2s ease;
        }

        .result-scalar {
            font-family: var(--mono);
            font-size: 1.5rem;
            color: var(--accent);
            animation: popIn 0.2s ease;
        }

        @keyframes popIn {
            from { transform: scale(0.85); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .result-error {
            color: var(--accent2);
            font-family: var(--mono);
            font-size: 0.85rem;
        }

        .result-empty {
            color: var(--muted);
            font-family: var(--mono);
            font-size: 0.8rem;
        }

        /* Reset */
        .reset-btn {
            background: none;
            border: none;
            color: var(--muted);
            font-family: var(--mono);
            font-size: 0.75rem;
            cursor: pointer;
            letter-spacing: 1px;
            padding: 4px 0;
            align-self: flex-end;
            text-decoration: underline;
            text-underline-offset: 3px;
            transition: color 0.15s;
        }
        .reset-btn:hover { color: var(--accent2); }

        /* Nav hint */
        .nav-hint {
            margin-top: 32px;
            font-family: var(--mono);
            font-size: 0.7rem;
            color: var(--muted);
            text-align: center;
        }
        .nav-hint a { color: var(--accent); text-decoration: none; }
        .nav-hint a:hover { text-decoration: underline; }
    </style>
</head>
<body>

<header>
    <h1>Vektor<span>rechner</span></h1>
    <p>Addition &amp; Skalarprodukt · n-dimensional</p>
</header>

<div class="calc-wrapper">

    <!-- Dimension selector -->
    <div class="dim-row">
        <label>DIM</label>
        <span>Wähle die Dimension:</span>
        <button class="dim-btn active" data-dim="2">2</button>
        <button class="dim-btn" data-dim="3">3</button>
        <button class="dim-btn" data-dim="4">4</button>
        <button class="dim-btn" data-dim="5">5</button>
    </div>

    <!-- Vector inputs -->
    <div class="vectors-row">
        <div class="vector-panel" data-label="VEKTOR A">
            <div class="vector-bracket">
                <span class="bracket">[</span>
                <div class="vector-inputs" id="inputsA"></div>
                <span class="bracket">]</span>
            </div>
        </div>

        <div class="op-symbol" id="opSymbol">+</div>

        <div class="vector-panel" data-label="VEKTOR B">
            <div class="vector-bracket">
                <span class="bracket">[</span>
                <div class="vector-inputs" id="inputsB"></div>
                <span class="bracket">]</span>
            </div>
        </div>
    </div>

    <!-- Operation buttons -->
    <div class="ops-row">
        <button class="op-btn primary" onclick="calculate('add')">+ Addition</button>
        <button class="op-btn" onclick="calculate('dot')">· Skalarprodukt</button>
    </div>

    <!-- Result -->
    <div class="result-panel" id="resultPanel">
        <span class="result-empty">← Wähle eine Operation</span>
    </div>

    <button class="reset-btn" onclick="reset()">↺ Zurücksetzen</button>

</div>

<div class="nav-hint">
    ← <a href="index.html">Zurück zur Startseite</a>
</div>

<script>
// ─── Vektor Klasse (aus Java übersetzt) ───────────────────────────────────────
class Vektor {
    constructor(arg) {
        if (Array.isArray(arg)) {
            // Vektor(int[] v)
            this.setVektor(arg);
        } else if (typeof arg === 'number') {
            // Vektor(int dim)
            this.dim = arg;
            this.v = new Array(arg).fill(0);
        }
    }

    setVektor(v) {
        if (v !== null && v !== undefined) {
            this.dim = v.length;
            this.v = [...v];
        } else {
            console.error("Fehler: Vektor darf nicht NULL sein");
        }
    }

    getVektor() {
        return this.v;
    }

    add(other) {
        if (other === null || other === undefined) {
            return { error: "Der andere Vektor ist NULL!" };
        }
        if (this.dim !== other.dim) {
            return { error: "Dimensionen stimmen nicht überein!" };
        }
        const erg = new Vektor(this.dim);
        for (let i = 0; i < this.dim; i++) {
            erg.v[i] = this.v[i] + other.v[i];
        }
        return erg;
    }

    dot(other) {
        if (other === null || other === undefined) {
            return { error: "Der andere Vektor ist NULL!" };
        }
        if (this.dim !== other.dim) {
            return { error: "Dimensionen stimmen nicht überein!" };
        }
        let sum = 0;
        for (let i = 0; i < this.dim; i++) {
            sum += this.v[i] * other.v[i];
        }
        return sum;
    }
}

// ─── UI Logik ─────────────────────────────────────────────────────────────────
let currentDim = 2;

function buildInputs(dim) {
    ['A', 'B'].forEach(label => {
        const container = document.getElementById(`inputs${label}`);
        container.innerHTML = '';
        for (let i = 0; i < dim; i++) {
            const inp = document.createElement('input');
            inp.type = 'number';
            inp.className = 'vector-input';
            inp.placeholder = '0';
            inp.value = '';
            inp.id = `v${label}_${i}`;
            container.appendChild(inp);
        }
    });
}

function getVector(label) {
    const vals = [];
    for (let i = 0; i < currentDim; i++) {
        const el = document.getElementById(`v${label}_${i}`);
        vals.push(Number(el.value) || 0);
    }
    return new Vektor(vals);
}

function calculate(op) {
    const a = getVector('A');
    const b = getVector('B');
    const panel = document.getElementById('resultPanel');
    const sym = document.getElementById('opSymbol');

    if (op === 'add') {
        sym.textContent = '+';
        const result = a.add(b);
        if (result.error) {
            panel.innerHTML = `<span class="result-error">⚠ ${result.error}</span>`;
        } else {
            const vals = result.getVektor().map(n =>
                `<span class="result-val">${n}</span>`
            ).join('');
            panel.innerHTML = `
                <span class="result-label">= Vektor</span>
                <div class="result-values">${vals}</div>`;
        }
    } else if (op === 'dot') {
        sym.textContent = '·';
        const result = a.dot(b);
        if (result && result.error) {
            panel.innerHTML = `<span class="result-error">⚠ ${result.error}</span>`;
        } else {
            panel.innerHTML = `
                <span class="result-label">= Skalar</span>
                <span class="result-scalar">${result}</span>`;
        }
    }
}

function reset() {
    ['A', 'B'].forEach(label => {
        for (let i = 0; i < currentDim; i++) {
            const el = document.getElementById(`v${label}_${i}`);
            if (el) el.value = '';
        }
    });
    document.getElementById('resultPanel').innerHTML =
        '<span class="result-empty">← Wähle eine Operation</span>';
    document.getElementById('opSymbol').textContent = '+';
}

// Dimension buttons
document.querySelectorAll('.dim-btn').forEach(btn => {
    btn.addEventListener('click', () => {
        document.querySelectorAll('.dim-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentDim = parseInt(btn.dataset.dim);
        buildInputs(currentDim);
        document.getElementById('resultPanel').innerHTML =
            '<span class="result-empty">← Wähle eine Operation</span>';
    });
});

// Init
buildInputs(currentDim);
</script>

</body>
</html>
